syntax = "proto3";

package pharmacy.core;

option java_package = "pharmacy.proto";
option java_multiple_files = true;

// ====== СЕРВИС A (Core Service) ======
// Предоставляет методы для Reference (если понадобится)

service CoreService {
  // Reference может запросить информацию о продажах (опционально)
  rpc GetMedicineStockInfo (StockInfoRequest) returns (StockInfoResponse);
}

message StockInfoRequest {
  string medicine_id = 1;
  string trace_id = 2;
}

message StockInfoResponse {
  bool exists = 1;
  int32 total_quantity = 2;
  double current_price = 3;
  string message = 4;
}